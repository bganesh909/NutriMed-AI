name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nutrimed

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api-gateway
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: ocr-service
            context: ./services/ocr-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    permissions:
      contents: read
      packages: read
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/nutrimed-ai
            # Run the compose and nginx files from the commit being deployed,
            # so they always match its images.
            git fetch --tags origin
            git checkout --force --detach ${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # The short-SHA tag build-and-push gave this commit's images.
            # (":latest" is not updated for tag builds.)
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            export IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            # Optional per-environment variable, e.g. "-f docker-compose.cpu.yml"
            # for a server without an NVIDIA GPU.
            COMPOSE_EXTRA="${{ vars.COMPOSE_EXTRA }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml $COMPOSE_EXTRA pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml $COMPOSE_EXTRA up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          # The API's health endpoint is /health (nginx proxies it); allow
          # time for images to start and the API to connect to its databases.
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ vars.STAGING_URL }}/health"; then
              echo
              echo "Staging deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Staging deployment did not become healthy"
          exit 1

  deploy-production:
    permissions:
      contents: read
      packages: read
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/nutrimed-ai
            # Run the compose and nginx files from the commit being deployed,
            # so they always match its images.
            git fetch --tags origin
            git checkout --force --detach ${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # The short-SHA tag build-and-push gave this commit's images.
            # (":latest" is not updated for tag builds.)
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            export IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            # Optional per-environment variable, e.g. "-f docker-compose.cpu.yml"
            # for a server without an NVIDIA GPU.
            COMPOSE_EXTRA="${{ vars.COMPOSE_EXTRA }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml $COMPOSE_EXTRA pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml $COMPOSE_EXTRA up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          # The API's health endpoint is /health (nginx proxies it); allow
          # time for images to start and the API to connect to its databases.
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health"; then
              echo
              echo "Production deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Production deployment did not become healthy"
          exit 1

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment to production completed with status: ${{ job.status }}"
