# Proxy settings shared by the /api locations in nginx.prod.conf.template.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge, so the client's own X-Forwarded-For is discarded: the API
# trusts this header (uvicorn --proxy-headers) for its per-IP rate limit and
# audit log, and a client-supplied value would let anyone pick their IP.
# If a load balancer or CDN is ever put in front, use the realip module instead.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

proxy_connect_timeout 60s;
# Above LLM_TIMEOUT_SECONDS (300 s by default): diet and workout generation can
# legitimately take that long on slower hardware.
proxy_send_timeout 330s;
proxy_read_timeout 330s;

# Stream uploads and responses instead of buffering them on disk.
proxy_buffering off;
proxy_request_buffering off;
